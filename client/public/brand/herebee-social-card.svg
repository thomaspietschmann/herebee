<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="textScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06080c" stop-opacity="0.94" />
      <stop offset="0.62" stop-color="#06080c" stop-opacity="0.72" />
      <stop offset="1" stop-color="#06080c" stop-opacity="0.18" />
    </linearGradient>
    <filter id="logoShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <clipPath id="logoClip">
      <circle cx="900" cy="292" r="215" />
    </clipPath>
  </defs>

  <image
    href="herebee-social-bg-generated.png"
    x="0"
    y="0"
    width="1200"
    height="630"
    preserveAspectRatio="xMidYMid slice"
  />
  <rect x="0" y="0" width="740" height="630" fill="url(#textScrim)" />

  <g filter="url(#logoShadow)">
    <circle cx="900" cy="292" r="215" fill="#06080c" />
    <image
      href="herebee-logo.png"
      x="685"
      y="77"
      width="430"
      height="430"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#logoClip)"
    />
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="132" fill="#fff7dd" font-size="84" font-weight="700">HereBee</text>
    <text x="96" y="224" fill="#f2ead7" font-size="42">Meet up in the moment.</text>
    <text x="98" y="296" fill="#d6e0dc" font-size="30">Private live location by link.</text>
    <text x="98" y="338" fill="#9ef0dc" font-size="30">End-to-end encrypted.</text>

    <g transform="translate(96 426)">
      <rect
        x="0"
        y="0"
        width="188"
        height="52"
        rx="26"
        fill="#34e1b4"
        fill-opacity="0.15"
        stroke="#34e1b4"
        stroke-opacity="0.62"
        stroke-width="2"
      />
      <text
        x="94"
        y="26"
        fill="#b9ffec"
        font-size="24"
        font-weight="700"
        text-anchor="middle"
        dominant-baseline="middle"
      >herebee.app</text>
    </g>
  </g>
</svg>
