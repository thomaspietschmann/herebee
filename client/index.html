<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0e1116" />
    <meta
      name="description"
      content="HereBee teilt Live-Standorte flüchtig per Link – privat, ohne Account und Ende-zu-Ende-verschlüsselt."
    />
    <link rel="canonical" href="https://herebee.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HereBee" />
    <meta property="og:title" content="HereBee — flüchtig zusammenfinden" />
    <meta
      property="og:description"
      content="Privaten Raum teilen, Live-Standorte sehen, nichts speichern. Ende-zu-Ende-verschlüsselt."
    />
    <meta property="og:url" content="https://herebee.app/" />
    <meta property="og:image" content="https://herebee.app/brand/herebee-social-card.png" />
    <meta property="og:image:secure_url" content="https://herebee.app/brand/herebee-social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="HereBee Logo auf einer dunklen Kartenansicht mit leuchtenden Standortpunkten"
    />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HereBee — flüchtig zusammenfinden" />
    <meta
      name="twitter:description"
      content="Privaten Raum teilen, Live-Standorte sehen, nichts speichern. Ende-zu-Ende-verschlüsselt."
    />
    <meta name="twitter:image" content="https://herebee.app/brand/herebee-social-card.png" />
    <meta
      name="twitter:image:alt"
      content="HereBee Logo auf einer dunklen Kartenansicht mit leuchtenden Standortpunkten"
    />
    <title>HereBee — flüchtig zusammenfinden</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="map" aria-label="Karte mit den Standorten der Raumteilnehmer"></div>

      <header class="hud">
        <div id="conn" class="brand" aria-live="polite">
          <span class="brand-mark-wrap">
            <img class="brand-mark" src="/brand/herebee-logo.png" alt="" aria-hidden="true" />
            <span class="brand-status" aria-hidden="true"></span>
          </span>
          <span class="wordmark">Here<b>Bee</b></span>
          <span id="conn-text" class="visually-hidden">Verbindung…</span>
        </div>
      </header>

      <button id="roster" class="roster" type="button" hidden>
        <span class="roster-stack" aria-hidden="true"></span>
        <span class="roster-count"></span>
      </button>

      <div class="dock">
        <p id="hint" class="hint" data-i18n="hint">
          Nur aktive Teilnehmer sehen dich. Standorte werden Ende-zu-Ende
          verschlüsselt und nicht gespeichert.
        </p>
        <div class="controls">
          <button id="share-btn" class="btn btn-ghost" type="button" data-i18n="shareLink">Link teilen</button>
          <button id="geo-btn" class="btn btn-primary" type="button">
            <span class="btn-label" data-i18n="shareLocation">Standort teilen</span>
          </button>
          <button id="info-btn" class="btn btn-icon" type="button" data-i18n-aria="infoAria" aria-label="Wie anonym ist das?">i</button>
        </div>
      </div>

      <div id="sheet" class="sheet" hidden>
        <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <button id="sheet-close" class="sheet-close" type="button" data-i18n-aria="close" aria-label="Schließen">×</button>
          <div id="sheet-body"></div>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
