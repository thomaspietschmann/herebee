# The conformance vectors are the only thing standing between a refactor and two
# clients that silently disagree — a different derived room id puts the phone in
# a different, valid, empty room, and nothing errors. Running them by hand is not
# a safety net, so they run here.
#
# Note the ordering trap this guards against: `npm run vectors` REGENERATES the
# file, so someone who habitually runs it after a change makes the TypeScript
# test go green. Only the Dart side, tested against the committed file, catches
# that. Both run below.
name: CI

on:
  push:
    branches: [main, mobile-apps]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web client, relay and vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:vectors
      - name: Vectors are committed in sync with the code
        run: |
          npm run vectors
          # Ciphertexts carry a random IV and differ every run; everything else
          # must be byte-identical or the committed file is stale.
          git diff --quiet -- shared/vectors.json || \
            node -e '
              const {execSync} = require("node:child_process");
              const before = JSON.parse(execSync("git show HEAD:shared/vectors.json"));
              const after = require("./shared/vectors.json");
              const strip = (o) => { o.crypto.messages.forEach((m) => delete m.ciphertext); return JSON.stringify(o); };
              if (strip(before) !== strip(after)) {
                console.error("shared/vectors.json is out of date; run `npm run vectors` and commit it");
                process.exit(1);
              }
            '

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      # Same pin as release-android.yml; bump both together.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      # Includes mobile/test/vectors_test.dart, which reads the SAME
      # shared/vectors.json the web job checks.
      - run: flutter test
        working-directory: mobile
