# Android release. Pushing a tag `android-vX.Y.Z` builds a signed release APK
# and attaches it to a GitHub Release of the same name:
#
#   git tag android-v0.0.1 && git push origin android-v0.0.1
#
# Signing material comes from repository secrets (never from the tree):
#   SIGNING_KEYSTORE_B64     the release keystore, base64-encoded
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias inside the keystore
#   SIGNING_KEY_PASSWORD     key password
# mobile/android/app/build.gradle.kts reads them through SIGNING_* env vars.
#
# The tag is namespaced so it never collides with the web app, which deploys
# from pushes to main and has no tags of its own.
name: Release Android

on:
  push:
    tags:
      - 'android-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pinned, not "stable": the Gradle/AGP versions in mobile/android are the
      # ones this Flutter release ships and supports. Bump both together.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#android-v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          IFS='.' read -r major minor patch <<< "$TAG"
          # Monotonic versionCode: major*10000 + minor*100 + patch.
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - run: flutter pub get
        working-directory: mobile

      - name: Build signed release APK
        working-directory: mobile
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/HereBee-${{ steps.version.outputs.name }}.apk"

      - name: Verify the APK is signed with the release key, not the debug key
        working-directory: mobile
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs \
            "build/app/outputs/flutter-apk/HereBee-${{ steps.version.outputs.name }}.apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "APK is debug-signed; refusing to release it" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HereBee Android ${{ steps.version.outputs.name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # Not marked as a pre-release: Obtainium and similar updaters skip
          # pre-releases by default and would report "no compatible release".
          # The README carries the development-status warning instead.
          files: mobile/build/app/outputs/flutter-apk/HereBee-${{ steps.version.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
