name: House numbers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the archive as a release and open a PR that pins it
        type: boolean
        default: false
  schedule:
    - cron: '0 3 5 */2 *'

permissions:
  contents: read

concurrency:
  group: addresses
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version | head -1

      - name: Pick the latest Geofabrik snapshot
        id: snap
        run: |
          snap=$(curl -fsSL -A "Mozilla/5.0" https://download.geofabrik.de/europe/germany.html \
            | grep -oE 'germany-[0-9]{6}\.osm\.pbf' | sed -E 's/germany-([0-9]{6}).*/\1/' | sort -u | tail -1)
          [ -n "$snap" ] || { echo "no snapshot found"; exit 1; }
          echo "snapshot=$snap" >> "$GITHUB_OUTPUT"
          echo "tag=addresses-20$snap" >> "$GITHUB_OUTPUT"
          echo "Snapshot: $snap"

      - name: Build
        env:
          SNAPSHOT: ${{ steps.snap.outputs.snapshot }}
          WORK: ${{ runner.temp }}/addr
          JAVA_OPTS: -Xmx10g
        run: scripts/addresses/build.sh

      - name: Summarize
        id: sum
        env:
          OUT: ${{ runner.temp }}/addr/${{ steps.snap.outputs.tag }}.pmtiles
        run: |
          sha=$(cut -d' ' -f1 "$OUT.sha256")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### House numbers ${{ steps.snap.outputs.tag }}"
            echo "- size: $(du -h "$OUT" | cut -f1)"
            echo "- sha256: \`$sha\`"
            echo "- publish: $PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: Publish release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.snap.outputs.tag }}
          SNAP: ${{ steps.snap.outputs.snapshot }}
          SHA: ${{ steps.sum.outputs.sha }}
          DIR: ${{ runner.temp }}/addr
        run: |
          cat > notes.md <<NOTES
          House numbers for Europe and the Americas as a vector tile overlay (PMTiles, zoom 14) for the HereBee map.

          - Source: OpenStreetMap, Geofabrik extracts of snapshot $SNAP (every country Geofabrik lists under Europe, North, Central and South America; US by state), deduplicated at borders with \`osmium merge\`.
          - Built with Planetiler by \`scripts/addresses/build.sh\` in this repository (workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          - SHA-256: \`$SHA\`

          **License:** Contains information from OpenStreetMap, © OpenStreetMap contributors, which is made available here under the Open Database License (ODbL) 1.0: https://opendatacommons.org/licenses/odbl/1-0/. This file is a derivative database and is likewise made available under the ODbL 1.0. See https://www.openstreetmap.org/copyright.
          NOTES
          gh release create "$TAG" --target "${{ github.sha }}" --latest=false \
            --title "House numbers Europe and Americas (OSM $SNAP)" --notes-file notes.md \
            "$DIR/$TAG.pmtiles" "$DIR/$TAG.pmtiles.sha256"

      - name: Open a PR that pins the new archive
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.snap.outputs.tag }}
          SHA: ${{ steps.sum.outputs.sha }}
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$TAG.pmtiles"
          for f in scripts/entrypoint.sh scripts/fetch-assets.sh; do
            sed -i -E "s#https://github.com/[^}\"]*/releases/download/addresses-[a-z-]*[0-9]{8}/addresses-[a-z-]*[0-9]{8}\.pmtiles#$url#; s#[0-9a-f]{64}(\}\")#$SHA\1#" "$f"
          done
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$TAG"
          git commit -am "Pin house numbers $TAG"
          git push -u origin "$TAG"
          gh pr create --title "Pin house numbers $TAG" --body "New house-number archive $TAG (sha256 \`$SHA\`). After merging, deploy the app so the entrypoint downloads it." \
            || echo "::warning::Could not open a PR automatically; branch $TAG is pushed, open the PR by hand."
